# yaml-language-server: $schema=https://ui5.github.io/cli/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: commodityupload
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertError: true # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /sap
            url: http://vpavd910.vetropack.corporate.ads:44300
            client: '100'
            destination: ERP_EMBEDDED_D91_100
            authenticationType: NoAuthentication
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: zgvt.upload.commodityupload
        ui5Theme: sap_fiori_3
builder:
  componentPreload:
    excludes:
      - "**/xlsx.js"