# yaml-language-server: $schema=https://ui5.github.io/cli/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: zgvt.upload.commodityupload
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: ERP_EMBEDDED_D91_100
          url: http://vpavd910.vetropack.corporate.ads:44300
          client: "100"
          auth: basic
        credentials:
          username: env:UI5_USERNAME
          password: env:UI5_PASSWORD       
        app:
          name: ZVGT_COM_UPL
          description: "Commodity Code Upload"
          package: ZVGT_MD_COM_UPL_APP
          transport: "D91K922573"
        exclude:
          - /test/
